name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    name: Secrets & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Secret Scanner
        run: node scripts/checkSecrets.js

      - name: Run Secret Scanner Unit Tests
        run: node --test scripts/checkSecrets.test.js

  backend:
    name: Backend API & Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Unit Tests (node:test)
        working-directory: backend
        run: npm test

      - name: Run API Integration Tests (Vitest + Supertest)
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/devopspulse_test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
          SCHEDULER_ENABLED: false
          CLIENT_ORIGIN: http://localhost:5173
        run: npm run test:api

  frontend:
    name: Frontend Component Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Component & Page Tests (Vitest + RTL)
        working-directory: frontend
        run: npm test

      - name: Build Production Assets (Vite)
        working-directory: frontend
        run: npm run build

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Production Audit
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Frontend Production Audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev

