name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  secrets:
    name: Secrets & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Secret Scanner
        run: node scripts/checkSecrets.js

      - name: Run Secret Scanner Unit Tests
        run: node --test scripts/checkSecrets.test.js

  backend:
    name: Backend API & Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Unit Tests (node:test)
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
        run: npm test

      - name: Run API Integration Tests (Vitest + Supertest)
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/devopspulse_test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
          SCHEDULER_ENABLED: false
          CLIENT_ORIGIN: http://localhost:5173
        run: npm run test:api

      - name: Upload Backend Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: backend/*.log
          retention-days: 7

  frontend:
    name: Frontend Component Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Component & Page Tests (Vitest + RTL)
        working-directory: frontend
        run: npm test

      - name: Build Production Assets (Vite)
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-logs
          path: frontend/*.log
          retention-days: 7

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend Production Audit
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Frontend Production Audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev

  quality-gate:
    name: Master Quality Gate Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Master Quality Gate Suite (--no-playwright)
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/devopspulse
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/devopspulse_test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
          SCHEDULER_ENABLED: false
          CLIENT_ORIGIN: http://localhost:5173
        run: node scripts/checkAll.js --no-playwright

      - name: Upload Test & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: reports/last-run
          retention-days: 14

      - name: Publish Quality Gate Summary to Step Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const summaryFile = 'reports/last-run/summary.json';
            if (!fs.existsSync(summaryFile)) process.exit(0);
            const s = JSON.parse(fs.readFileSync(summaryFile, 'utf8'));
            let md = '### Quality Gate Execution Summary (' + (s.overall.passed ? '✅ PASSED' : '❌ FAILED') + ')\n\n';
            md += '| # | Suite | Tests | Passed | Failed | Skipped | Duration | Status |\n';
            md += '|---|---|---|---|---|---|---|---|\n';
            s.suites.forEach((st, idx) => {
              md += '| ' + (idx + 1) + ' | ' + st.name + ' | ' + (st.tests ?? '-') + ' | ' + (st.passed ?? '-') + ' | ' + (st.failed ?? '-') + ' | ' + (st.skipped ?? 0) + ' | ' + (st.durationMs / 1000).toFixed(1) + 's | ' + (st.status === 'passed' ? '✅' : '❌') + ' |\n';
            });
            md += '\n**Overall Duration**: ' + (s.overall.durationMs / 1000).toFixed(1) + 's | **Git Clean**: ' + s.git.clean + ' | **Commit**: ' + s.git.commit + '\n';
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "
